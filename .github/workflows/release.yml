name: Build desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to build and publish
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

jobs:
  draft:
    name: Prepare release draft
    runs-on: ubuntu-latest
    steps:
      - name: Create the shared draft before parallel builds start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --draft \
            --title "Song Maker $RELEASE_TAG" \
            --notes "Install the desktop app for Windows, macOS, or Linux using the matching asset below.

          Song Maker downloads YuE2 and HTDemucs model files separately on first setup. They require several gigabytes of free disk space. Generation requires NVIDIA CUDA on Windows/Linux or Apple Metal on macOS. Follow the guide at https://website-ten-iota-41.vercel.app/en/docs/install.

          ---

          Installez l’application de bureau correspondant à votre système avec le fichier ci-dessous.

          Song Maker télécharge séparément les modèles YuE2 et HTDemucs lors de la première configuration. Prévoyez plusieurs gigaoctets d’espace libre. La génération demande NVIDIA CUDA sous Windows/Linux ou Apple Metal sous macOS. Suivez le guide : https://website-ten-iota-41.vercel.app/fr/docs/install."

  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            args: ""
          - name: Linux x64
            runner: ubuntu-22.04
            args: ""
          - name: macOS Apple Silicon
            runner: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            runner: macos-latest
            args: "--target x86_64-apple-darwin"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 rpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: .
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish after every platform build succeeds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Song Maker ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
