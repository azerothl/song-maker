name: Build desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to build and publish
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: write

# One desktop release at a time. A newer tag run cancels a stuck verify
# (v0.2.0 hung here: pnpm test launches Playwright without Chromium).
concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # The `tauri` crate links against these on Linux; without them the crate
      # does not compile and the Rust checks below cannot run.
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # rust-toolchain.toml pins channel/components. dtolnay/rust-toolchain@master
      # requires `with.toolchain` and does not read that file (v0.1.2 verify died here).
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # pnpm test includes src/**/*.behavior.test.ts, which call chromium.launch().
      # Without browsers, node:test has no timeout and verify hangs (v0.2.0).
      - name: Install Playwright Chromium (tests B1 / captures)
        run: pnpm exec playwright install chromium --with-deps

      # Mirrors .github/workflows/ci.yml so a tag can never publish code that
      # CI would have rejected.
      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test
          pnpm packages:typecheck
          pnpm packages:test

      - name: Lint and test Rust
        run: |
          pnpm rust:fmt:check
          pnpm rust:clippy
          pnpm rust:test

  draft:
    name: Prepare release draft
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Create the shared draft before parallel builds start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          NOTES_FILE="docs/releases/${RELEASE_TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="$(mktemp)"
            cat > "$NOTES_FILE" <<'EOF'
          Install the desktop app for Windows, macOS, or Linux using the matching asset below.

          Song Maker downloads YuE2 and HTDemucs model files separately on first setup. They require several gigabytes of free disk space. Generation requires NVIDIA CUDA on Windows/Linux or Apple Metal on macOS. Follow the guide at https://website-ten-iota-41.vercel.app/en/docs/install.

          ---

          Installez l’application de bureau correspondant à votre système avec le fichier ci-dessous.

          Song Maker télécharge séparément les modèles YuE2 et HTDemucs lors de la première configuration. Prévoyez plusieurs gigaoctets d’espace libre. La génération demande NVIDIA CUDA sous Windows/Linux ou Apple Metal sous macOS. Suivez le guide : https://website-ten-iota-41.vercel.app/fr/docs/install.
          EOF
          fi
          gh release create "$RELEASE_TAG" \
            --repo azerothl/song-maker \
            --draft \
            --title "Song Maker $RELEASE_TAG" \
            --notes-file "$NOTES_FILE"

  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            args: ""
            signingArgs: "--config src-tauri/tauri.windows.signing.generated.json"
          - name: Linux x64
            runner: ubuntu-22.04
            args: ""
            signingArgs: ""
          - name: macOS Apple Silicon
            runner: macos-latest
            args: "--target aarch64-apple-darwin"
            signingArgs: ""
          - name: macOS Intel
            runner: macos-latest
            args: "--target x86_64-apple-darwin"
            signingArgs: ""

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 rpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        run: |
          rustup toolchain install
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Windows code-signing credentials
        if: matrix.name == 'Windows x64'
        shell: pwsh
        env:
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $required = @{
            WINDOWS_SIGNING_ENDPOINT = $env:WINDOWS_SIGNING_ENDPOINT
            WINDOWS_SIGNING_ACCOUNT = $env:WINDOWS_SIGNING_ACCOUNT
            WINDOWS_SIGNING_PROFILE = $env:WINDOWS_SIGNING_PROFILE
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET = $env:AZURE_CLIENT_SECRET
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) {
            throw "Windows Authenticode signing is required for releases. Configure repository variables WINDOWS_SIGNING_ENDPOINT, WINDOWS_SIGNING_ACCOUNT, WINDOWS_SIGNING_PROFILE and secrets AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID. Missing: $($missing -join ', ')"
          }

      - name: Install Azure Artifact Signing CLI
        if: matrix.name == 'Windows x64'
        run: cargo install artifact-signing-cli --locked --version 0.11.0

      - name: Generate Tauri Windows signing configuration
        if: matrix.name == 'Windows x64'
        shell: pwsh
        env:
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
        run: |
          $config = @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd = "artifact-signing-cli"
                  args = @(
                    "-e", $env:WINDOWS_SIGNING_ENDPOINT,
                    "-a", $env:WINDOWS_SIGNING_ACCOUNT,
                    "-c", $env:WINDOWS_SIGNING_PROFILE,
                    "-d", "Song Maker",
                    "%1"
                  )
                }
              }
            }
          } | ConvertTo-Json -Depth 8 -Compress
          $configPath = Join-Path $env:GITHUB_WORKSPACE "src-tauri/tauri.windows.signing.generated.json"
          [System.IO.File]::WriteAllText($configPath, $config, [System.Text.UTF8Encoding]::new($false))

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: .
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          retryAttempts: 3
          args: ${{ matrix.args }} ${{ matrix.signingArgs }}

      - name: Remove generated signing configuration
        if: always() && matrix.name == 'Windows x64'
        shell: pwsh
        run: Remove-Item -LiteralPath "src-tauri/tauri.windows.signing.generated.json" -ErrorAction SilentlyContinue

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish after every platform build succeeds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Song Maker ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
