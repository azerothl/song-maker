[package]
name = "song-maker"
version = "0.1.0"
description = "Song Maker — premier build (phase 1)"
authors = ["Song Maker"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "song_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
regex = "1"
dirs = "6"
getrandom = "0.2"
parking_lot = "0.12"
hound = "3.5"
midir = "0.11"
cpal = "0.15"
libloading = "0.8"
walkdir = "2"
base64 = "0.22"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
vst3-host = { version = "=0.9.0", default-features = false }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Ole",
  "Win32_UI_WindowsAndMessaging",
] }
wasapi = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Model integrity checks should stay usable in native development builds.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
